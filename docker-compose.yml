version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: arcana-rabbitmq
    ports:
      - "5672:5672"    # porta que o Spring Boot conecta
      - "15672:15672"  # painel de administração web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: